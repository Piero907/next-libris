/* ---------- pagina delle prove ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E7E9E8;color:#1b1f1d;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.page-dark{background:#0b0d0c;color:#e8ecea}
.ctl{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 16px;background:rgba(231,233,232,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(0,0,0,.08)}
body.page-dark .ctl{background:rgba(11,13,12,.9);border-color:rgba(255,255,255,.08)}
.ctl h1{font-size:15px;font-weight:700;margin-right:auto}
.sg{display:inline-flex;background:rgba(0,0,0,.07);border-radius:999px;padding:3px}
body.page-dark .sg{background:rgba(255,255,255,.1)}
.sg button{border:0;background:none;font:600 13px/1 system-ui,sans-serif;color:inherit;padding:8px 12px;border-radius:999px;cursor:pointer}
.sg button.on{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.exp{max-width:1100px;margin:14px auto 0;padding:0 16px;font-size:14px}
.exp b{font-size:16px}
.exp p{margin-top:4px;opacity:.8}
.row{display:flex;gap:22px;overflow-x:auto;padding:16px 16px 32px;scroll-snap-type:x mandatory}
.ph{flex:0 0 auto;scroll-snap-align:center}
.lbl{font:600 13px/1.2 system-ui,sans-serif;margin:0 0 8px 6px;opacity:.75}
.phone{width:360px;height:760px;border-radius:38px;padding:10px;background:#111;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.scr{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--fb);display:flex;flex-direction:column}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.note{max-width:1100px;margin:0 auto 30px;padding:0 16px;font-size:13px;opacity:.7}

.bosco.dark{--bg:#0F1513;--surface:#161E1B;--surface2:#1D2723;--ink:#E4ECE8;--muted:#98A8A0;--line:#29352F;--accent:#8FD1AE;--accent-ink:#0B2016;--accent-soft:#1D3A2D;--brass:#E1B65A;--gilt:#E6CF8F;--bad:#FF958B;--bad-bg:#3D1E1C;--warn:#F1C064;--warn-bg:#382A12;--cl:30%;--cs:26%}
.inch{--bg:#EDF0F5;--surface:#FFFFFF;--surface2:#F3F5F9;--ink:#18202F;--muted:#5A6477;--line:#D7DCE6;--accent:#2C47A3;--accent-ink:#FFFFFF;--accent-soft:#E3E8F7;--brass:#A77A1E;--gilt:#EBD9A6;--bad:#B02F28;--bad-bg:#FBE7E5;--warn:#86500A;--warn-bg:#FFF1D9;--cl:34%;--cs:30%}
.inch.dark{--bg:#10141D;--surface:#171D29;--surface2:#1E2534;--ink:#E7EAF1;--muted:#9BA4B7;--line:#2A3245;--accent:#A3B5FF;--accent-ink:#0F1733;--accent-soft:#232D4E;--brass:#E1B65A;--gilt:#E6CF8F;--bad:#FF958B;--bad-bg:#3D1E1C;--warn:#F1C064;--warn-bg:#382A12;--cl:30%;--cs:26%}
/* colori d'autunno delle tessere (profilo) */
.scr{--s1:#A8664A;--s2:#C99A62;--s3:#8A9160}

/* ---------- parti comuni ---------- */
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:6px;padding:14px 16px 8px}
.brand{font:700 19px/1 var(--fd);letter-spacing:-.01em;margin-right:auto}
.ib{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.ib .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font:700 10px/16px var(--fb);text-align:center}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 14px/1 var(--fb);color:#fff;background:linear-gradient(135deg,#5d8c76,#24563F)}
.av.m{background:linear-gradient(135deg,#c48a6a,#8f4f3b)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font:600 13px/1 var(--fb);padding:8px 12px;white-space:nowrap}
.beer{background:var(--warn-bg);color:var(--warn)}
.who{display:flex;align-items:center;gap:10px;padding:4px 16px 0}
.who .n{font:600 15px/1.2 var(--fb);margin-right:auto}
.hero{padding:14px 16px 4px}
.hero h2{font:700 26px/1.1 var(--fd);letter-spacing:-.015em}
.hero p{color:var(--muted);font-size:14px;margin-top:4px}
.search{display:flex;align-items:center;gap:8px;margin:12px 16px 0;height:44px;padding:0 14px;color:var(--muted);font-size:15px}
.tools{display:flex;gap:8px;align-items:center;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;font:500 13px/1 var(--fb);white-space:nowrap;color:var(--ink)}
.chip svg.i{width:17px;height:17px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.vt{margin-left:auto;display:inline-flex;border-radius:999px;padding:3px;gap:2px}
.vt span{width:32px;height:28px;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.vt span svg.i{width:18px;height:18px}
.vt span.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.grp{display:flex;align-items:baseline;gap:8px;padding:18px 16px 10px}
.grp h3{font:700 16px/1.2 var(--fd)}
.grp small{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px;padding:0 16px}
.bk{min-width:0}
.bk .t{font:600 13px/1.25 var(--fb);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk .a{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cvw{position:relative}
.cv{position:relative;aspect-ratio:2/3;width:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:9% 9% 10%;color:#fff;background:hsl(var(--h) var(--cs) var(--cl))}
.cv .ct{font:600 var(--fs,13px)/1.12 "Literata",Georgia,serif;color:var(--gilt);text-wrap:balance}
.cv .ca{font:500 8.5px/1.2 "IBM Plex Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase;opacity:.85;color:#fff}
.cv.v1::before{content:"";position:absolute;left:0;right:0;top:58%;height:3px;background:var(--gilt);opacity:.55}
.cv.v2{background:linear-gradient(160deg,hsl(var(--h) 45% 62%),hsl(var(--h) 40% 34%))}
.cv.v2 .ct{color:#fff;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.02em}
.cv.v3{background:hsl(var(--h) 30% 88%)}
.cv.v3 .ct{color:hsl(var(--h) 45% 25%)}
.cv.v3 .ca{color:hsl(var(--h) 35% 30%)}
.cv.v3::after{content:"";position:absolute;inset:auto 18% 32% 18%;aspect-ratio:1;border-radius:50%;background:hsl(var(--h) 45% 55%);opacity:.5}
.bdg{position:absolute;display:inline-flex;align-items:center;gap:3px;font:700 10px/1 var(--fb);padding:4px 7px;border-radius:999px}
.bdg.rd{left:6px;bottom:6px;background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.bdg.ln{left:6px;bottom:6px;background:var(--warn-bg);color:var(--warn);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.bdg.ok{right:6px;top:6px;background:var(--accent);color:var(--accent-ink);width:22px;height:22px;padding:0;justify-content:center}
.bdg.st{right:6px;top:6px;background:var(--surface);color:var(--brass);width:24px;height:24px;padding:0;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.bdg svg.i{width:13px;height:13px;stroke-width:2.4}
.bdg.st svg.i{fill:currentColor;stroke-width:1.5}
.stack .cvw::before,.stack .cvw::after{content:"";position:absolute;inset:0;background:hsl(var(--h) var(--cs) calc(var(--cl) + 12%));transform:translate(5px,-5px);z-index:-1;border-radius:inherit}
.stack .cvw::after{transform:translate(10px,-10px);opacity:.6;z-index:-2}
.stack .cvw{isolation:isolate;margin-right:10px}
.cnt{color:var(--accent);font-weight:600}

.list{padding:0 16px}
.it{display:flex;gap:14px;align-items:center;padding:12px 0}
.it .cv{width:54px;flex:none;padding:6px}
.it .cv .ct{font-size:8px}
.it .cv .ca{display:none}
.it .tx{min-width:0;flex:1}
.it .t{font:600 15px/1.25 var(--fb)}
.it .a{color:var(--muted);font-size:13px;margin-top:2px}
.it .m{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}
.tag{font:600 11px/1 var(--fb);padding:5px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.w{background:var(--warn-bg);color:var(--warn)}
.tag.g{background:var(--surface2);color:var(--muted)}
.libr{display:inline-flex;gap:1px;color:var(--brass)}.libr svg.i{width:13px;height:13px;fill:currentColor;stroke-width:1}.libr svg.off{fill:none;opacity:.5}
.it .st{color:var(--brass)}
.it .st svg.i{width:18px;height:18px;fill:currentColor;stroke-width:1.4}

.tabbar{display:flex;justify-content:space-around;align-items:center;padding:8px 6px 14px;background:var(--surface);border-top:1px solid var(--line);flex:none}
.tb{display:grid;justify-items:center;gap:3px;font:500 10.5px/1 var(--fb);color:var(--muted);width:62px}
.tb.on{color:var(--accent);font-weight:700}
.tb.plus{width:56px}
.tb.plus span{width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.22)}
.tb.plus svg.i{width:26px;height:26px;stroke-width:2.4}

.back{display:flex;align-items:center;gap:8px;padding:14px 12px 6px}
.back .t{font:700 17px/1.1 var(--fd);margin-right:auto}
.seg2{display:flex;margin:8px 16px 0;border-radius:12px;padding:3px}
.seg2 span{flex:1;text-align:center;padding:9px 0;border-radius:9px;font:600 14px/1 var(--fb);color:var(--muted)}
.seg2 span.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.legend{display:flex;gap:6px;align-items:center;padding:10px 16px 0;color:var(--muted);font-size:12.5px}
.legend .bdg{position:static}

/* profilo */
.pf{display:grid;justify-items:center;text-align:center;padding:14px 16px 4px}
.pf .avb{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font:700 34px/1 var(--fd);color:#fff;background:linear-gradient(135deg,#5d8c76,#24563F);position:relative}
.pf .avb.m{background:linear-gradient(135deg,#d39a78,#8f4f3b)}
.pf .cam{position:absolute;right:0;bottom:2px;width:30px;height:30px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.pf .cam svg.i{width:16px;height:16px}
.pf h2{font:700 24px/1.1 var(--fd);margin-top:12px;letter-spacing:-.01em}
.pf p{color:var(--muted);font-size:13.5px;margin-top:4px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 16px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:12px;font:600 14px/1 var(--fb);color:var(--ink);background:var(--surface2)}
.btn.pr{background:var(--accent);color:var(--accent-ink)}
.btn.ic{width:40px;padding:0}
.btn.rm{color:var(--bad);background:var(--bad-bg)}
.btn svg.i{width:18px;height:18px}
.follow{margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font:600 14px/1.3 var(--fb);display:flex;align-items:center;gap:8px}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:22px 16px 10px}
.sec h3{font:700 17px/1.2 var(--fd)}
.sec a{color:var(--accent);font:600 13px/1 var(--fb)}
.shelf{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.shelf .bk{flex:0 0 92px}
.ttl{font:700 17px/1.2 var(--fd)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.tile{border-radius:18px;padding:14px;color:#fff;min-width:0}
.tile .k{font:600 12px/1.2 var(--fb);opacity:.9}
.tile .v{font:800 34px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin-top:6px}
.tile .v small{font-size:15px;font-weight:600;opacity:.9;margin-left:4px;letter-spacing:0}
.tile .s{font-size:12px;opacity:.9;margin-top:4px}
.tile.big{grid-column:1/-1;background:var(--s1)}
.tile.b2{background:var(--s2);color:#2a1a12}
.tile.b3{background:var(--s3)}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:75%;background:#fff;border-radius:9px}
.spines{display:flex;gap:3px;align-items:flex-end;margin-top:12px;height:34px}
.spines i{display:block;width:7px;border-radius:2px;background:rgba(255,255,255,.75)}
.ctry{grid-column:1/-1;border:1.5px solid var(--line);border-radius:18px;padding:14px;color:var(--ink)}
.ctry .k{color:var(--muted);opacity:1}
.flags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.fl{width:28px;height:20px;border-radius:4px;overflow:hidden;display:flex;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.fl i{flex:1}
.fl.h{flex-direction:column}
.ever{padding:0 16px}
.ev{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev span{color:var(--muted)}
.ev b{font-weight:600;text-align:right}
.sp{height:24px}

/* ================= DIREZIONE A — «Arioso» ================= */
.dA{--fd:"Bricolage Grotesque",sans-serif;--fb:"IBM Plex Sans",sans-serif}
.dA .scr{background:var(--surface)}
.dA.dark .scr{background:var(--bg)}
.dA .search{background:var(--surface2);border-radius:999px}
.dA.dark .search{background:var(--surface)}
.dA .chip{background:transparent;border:1px solid var(--line)}
.dA .chip.on{border-color:transparent}
.dA .vt{background:var(--surface2)}
.dA.dark .vt{background:var(--surface)}
.dA .vt span.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.dA .cv{border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.dA .grid{gap:22px 14px}
.dA .it{padding:10px 0}
.dA .tabbar{border-top:0;box-shadow:0 -1px 0 var(--line)}
.dA .seg2{background:var(--surface2)}
.dA.dark .seg2{background:var(--surface)}
.dA .btn{border-radius:999px}
.dA .follow{border-radius:999px;justify-content:center}
.dA .ev{border-bottom:0;padding:9px 0}
.dA .ever{margin:0 16px;padding:4px 14px;background:var(--surface2);border-radius:18px}
.dA.dark .ever{background:var(--surface)}

/* ================= DIREZIONE B — «Editoriale» ================= */
.dB{--fd:"Literata",Georgia,serif;--fb:"IBM Plex Sans",sans-serif}
.dB .brand{font-weight:600;font-style:italic;font-size:21px}
.dB .top{border-bottom:1px solid var(--line);padding-bottom:10px}
.dB .hero h2{font-size:32px;font-weight:600;letter-spacing:-.02em}
.dB .hero p{font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.dB .search{background:transparent;border-bottom:1.5px solid var(--ink);border-radius:0;margin:10px 16px 0;padding:0 2px}
.dB .chip{background:transparent;padding:0 2px;height:28px;border-radius:0;font-weight:600}
.dB .chip.on{background:transparent;color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.dB .vt{background:transparent}
.dB .vt span.on{background:transparent;box-shadow:none;color:var(--accent)}
.dB .grp{border-top:1px solid var(--line);margin:14px 16px 12px;padding:10px 0 0}
.dB .grp h3{font-size:13px;font-family:var(--fb);text-transform:uppercase;letter-spacing:.1em}
.dB .cv{border-radius:1px 3px 3px 1px;box-shadow:0 1px 1px rgba(0,0,0,.2),0 4px 10px rgba(0,0,0,.12)}
.dB .bk .t{font:600 13.5px/1.25 var(--fd)}
.dB .it{border-bottom:1px solid var(--line)}
.dB .it .t{font:600 16px/1.25 var(--fd)}
.dB .tag{background:transparent;padding:0;border-radius:0;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
.dB .tag.w{background:transparent}
.dB .tag.g{background:transparent}
.dB .tabbar{background:var(--bg)}
.dB .tb.plus span{border-radius:14px;box-shadow:none}
.dB .back{border-bottom:1px solid var(--line);padding-bottom:10px}
.dB .seg2{background:transparent;border-bottom:1px solid var(--line);border-radius:0;padding:0}
.dB .seg2 span{border-radius:0;box-shadow:none;background:transparent}
.dB .seg2 span.on{box-shadow:inset 0 -2px 0 var(--accent);color:var(--accent)}
.dB .pf h2{font-size:30px;font-weight:600}
.dB .btn{border-radius:4px;background:transparent;border:1px solid var(--line)}
.dB .btn.pr{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dB .btn.rm{border-color:transparent}
.dB .follow{border-radius:4px;background:transparent;border:1px solid var(--accent)}
.dB .sec{border-top:1px solid var(--line);margin:22px 16px 10px;padding:10px 0 0}
.dB .sec h3{font-size:13px;font-family:var(--fb);text-transform:uppercase;letter-spacing:.1em}
.dB .ttl{font-size:13px;font-family:var(--fb);text-transform:uppercase;letter-spacing:.1em}
.dB .tile{border-radius:6px}
.dB .tile .v{font-family:"Literata",serif;font-weight:600}
.dB .ctry{border-radius:6px}
.dB .ev b{font-family:var(--fd);font-weight:600}

/* ================= DIREZIONE C — «Schede» ================= */
.dC{--fd:"Bricolage Grotesque",sans-serif;--fb:"Atkinson Hyperlegible",sans-serif}
.dC .top{padding-top:12px}
.dC .ib{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.dC .search{background:var(--surface);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.dC .chip{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.dC .vt{background:var(--surface)}
.dC .vt span.on{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.dC .gridcard{margin:0 12px;padding:14px 10px 16px;background:var(--surface);border-radius:20px}
.dC .gridcard .grid{padding:0 2px}
.dC .gridcard .grp{padding:2px 4px 12px}
.dC .cv{border-radius:8px}
.dC .list{padding:0 12px}
.dC .it{background:var(--surface);border-radius:16px;padding:10px;margin-bottom:8px}
.dC .tabbar{margin:0 12px 12px;border-radius:24px;border:0;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px 4px}
.dC .tb.plus span{width:46px;height:46px;border-radius:16px;box-shadow:none}
.dC .seg2{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.dC .seg2 span.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.dC .pfcard{margin:8px 12px 0;background:var(--surface);border-radius:24px;padding:18px 0 16px}
.dC .pf{padding-top:0}
.dC .btn{border-radius:14px}
.dC .follow{margin:10px 12px 0}
.dC .secard{margin:12px 12px 0;background:var(--surface);border-radius:20px;padding:2px 0 14px}
.dC .secard .sec{padding:14px 14px 10px}
.dC .secard .shelf{padding:0 14px 2px}
.dC .tiles{padding:0 12px}
.dC .tile{border-radius:20px}
.dC .ctry{background:var(--surface);border:0}
.dC .ever{margin:10px 12px 0;padding:4px 14px;background:var(--surface);border-radius:20px}
.dC .ev:last-child{border-bottom:0}
.dC .sec.out{padding:22px 16px 10px}
/* ===== stile C: parti nuove ===== */
.dC .crd{margin:12px 12px 0;background:var(--surface);border-radius:20px;padding:14px}
.dC .crd h3{font:700 16px/1.2 var(--fd);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.dC .crd h3 small{font:500 13px/1 var(--fb);color:var(--muted)}
.dC .crd p{font-size:14px;line-height:1.5}
.mut{color:var(--muted)}
/* scheda del libro */
.bp-top{position:relative;padding:8px 12px 0}
.bp-hero{display:grid;justify-items:center;text-align:center;padding:6px 16px 0}
.bp-hero .cvw{width:132px}
.bp-hero h1{font:800 24px/1.12 var(--fd);letter-spacing:-.015em;margin-top:16px;text-wrap:balance}
.bp-hero .au{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:15px;color:var(--accent);font-weight:700}
.bp-hero .au .fl{width:18px;height:13px;border-radius:2px}
.bp-hero .au span{color:var(--muted);font-weight:400;font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.meta span{font:500 12.5px/1 var(--fb);padding:7px 10px;border-radius:999px;background:var(--surface);color:var(--muted)}
.acts2{display:flex;justify-content:center;gap:10px;margin-top:16px}
.rb{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.rb.on{color:var(--brass)}
.rb.on svg.i{fill:currentColor}
.rb.bad{color:var(--bad)}
.segs{display:flex;background:var(--surface2);border-radius:14px;padding:3px}
.segs span{flex:1;text-align:center;padding:10px 0;border-radius:11px;font:700 13.5px/1 var(--fb);color:var(--muted)}
.segs span.on{background:var(--accent);color:var(--accent-ink)}
.rate{display:flex;align-items:center;gap:10px;margin-top:14px}
.rate .libr svg.i{width:22px;height:22px}
.rate b{font:700 14px/1 var(--fb)}
.mark{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.mark svg.i{color:var(--accent)}
.lnk{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.lnk:first-of-type{border-top:0}
.lnk .em{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:18px;flex:none}
.lnk .tx{flex:1;min-width:0}
